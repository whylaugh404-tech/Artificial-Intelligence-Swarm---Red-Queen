version: 2.1

jobs:
  test-node:
    docker:
      - image: cimg/node:20.19.0
    steps:
      - checkout
      - run:
          name: Verify Node and npm versions
          command: |
            node --version
            npm --version
      - run:
          name: Installing NPM packages
          command: npm ci --include=optional
      - run:
          name: Typecheck
          command: npm run lint
      - run:
          name: Run tests
          command: npm test -- --passWithNoTests

  build-node:
    docker:
      - image: cimg/node:20.19.0
    steps:
      - checkout
      - run:
          name: Verify Node and npm versions
          command: |
            node --version
            npm --version
      - run:
          name: Installing NPM packages
          command: npm ci --include=optional
      - run:
          name: Build
          command: npm run build
      - run:
          name: Create the ~/artifacts directory if it doesn't exist
          command: mkdir -p ~/artifacts
      - run:
          name: Copy artifacts
          command: cp -R build dist public .output .next .docusaurus ~/artifacts 2>/dev/null || true
      - store_artifacts:
          path: ~/artifacts
          destination: node-build

workflows:
  build-and-test:
    jobs:
      - test-node
      - build-node:
          requires:
            - test-node
